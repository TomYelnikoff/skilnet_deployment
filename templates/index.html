<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Conversation history">
      <div class="sidebar-top">
        <div class="brand">
          <div class="avatar avatar-bot" aria-hidden="true">AI</div>
          <h1>AI Assistant</h1>
        </div>
        <button id="new-btn" class="btn-primary" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </div>
      <nav id="history" class="history"></nav>
      <div class="sidebar-user">
        <span class="user-email" title="{{ email }}">{{ email }}</span>
        <button id="logout-btn" class="btn-link" type="button">Sign out</button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <section class="panel">
      <header class="panel-header">
        <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Toggle history">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="panel-title">
          <h2 id="title">New conversation</h2>
          <p class="status"><span class="dot"></span>Online<span id="totals" class="totals"></span></p>
        </div>
      </header>

      <main id="chat" class="chat" aria-live="polite"></main>

      <footer class="composer">
        <form id="chat-form" autocomplete="off">
          <textarea id="input" rows="1" placeholder="Type your message…" aria-label="Message" maxlength="8000"></textarea>
          <button id="send-btn" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
        <p class="hint">Enter to send · Shift+Enter for a new line</p>
      </footer>
    </section>
  </div>

  <template id="welcome-tpl">
    <div class="welcome">
      <div class="avatar avatar-bot large" aria-hidden="true">AI</div>
      <h3 class="headline">Ask boldly. <span>Build brilliantly.</span></h3>
      <p>Your AI assistant is ready. Ask a question or pick a suggestion to get started.</p>
      <div class="suggestions">
        <button type="button" class="chip">Summarize a topic for me</button>
        <button type="button" class="chip">Help me draft an email</button>
        <button type="button" class="chip">Explain a concept simply</button>
      </div>
    </div>
  </template>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
