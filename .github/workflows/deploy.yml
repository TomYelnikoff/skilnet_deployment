name: Deploy

# Every push to main: build the image, push it to ECR, and redeploy the
# container on the EC2 instance (through SSM, so no SSH or open ports needed).
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow a manual re-run from the Actions tab

permissions:
  id-token: write   # OIDC token for AWS, no long-lived keys stored in GitHub
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never interrupt a deploy that is already running

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: chatbot-alexk
  INSTANCE_NAME: silknet-deployment-alexk
  AWS_ROLE_ARN: arn:aws:iam::881490130721:role/silknet-github-actions-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running instance named $INSTANCE_NAME"; exit 1
          fi
          echo "Deploying $IMAGE to $INSTANCE_ID"

          SCRIPT_B64=$(base64 -w0 deploy/remote-deploy.sh)
          PARAMS=$(jq -n --arg b "$SCRIPT_B64" --arg img "$IMAGE" \
            '{commands: ["echo \($b) | base64 -d > /tmp/remote-deploy.sh",
                         "IMAGE=\($img) bash /tmp/remote-deploy.sh"]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          STATUS=InProgress
          for _ in $(seq 1 90); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "---- remote output ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment finished with status $STATUS"; exit 1
          fi
          echo "Deployed ${GITHUB_SHA::7} to $INSTANCE_ID"
